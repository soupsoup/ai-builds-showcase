server {
    listen 80;
    listen [::]:80;
    server_name builds.antderosa.com;
    root /var/www/builds;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The checkout holds the git data and the deploy kit; serve only the pages.
    location ~ /\. { return 404; }
    location ^~ /deploy/ { return 404; }
    location ~ \.md$ { return 404; }

    location / { try_files $uri $uri.html $uri/ =404; }
}
